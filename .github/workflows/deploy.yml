name: Deploy & Container Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-verify-backend:
    name: Build & Verify Backend Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: fintra-ai-backend:latest

  build-and-verify-frontend:
    name: Build & Verify Frontend Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Image with Build Args
        uses: docker/build-push-action@v5
        with:
          context: ./ai-finance-platform
          file: ai-finance-platform/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_ZmludHJhLWFpLTEuY2xlcmsuYWNjb3VudHMuZGV2JA==
            NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in
            NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up
            NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL=/onboarding
            NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL=/onboarding
            NEXT_PUBLIC_ML_SERVICE_URL=http://localhost:8000
          tags: fintra-ai-frontend:latest
